<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RM換算表｜重量×回数の推定1RMマトリクス</title>
<meta name="description" content="縦=重量、横=回数で推定1RMが一目でわかる換算表。ベンチプレス・スクワット・デッドリフトの目安に。">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("rm_theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<style>
:root{--bg:#f4f6f9;--fg:#1c2430;--card:#fff;--in:#fff;--bd:#cfd6e0;--sel:#eef1f6;--hd:#e6ebf2;--grid:#e2e7ee;--grid2:#edf0f5;--strong:#9aa6b6;--hl:#fff0dc;--acc:#d9531f;--shadow:0 2px 10px rgba(30,50,80,.08)}
:root[data-theme=dark]{--bg:#14171c;--fg:#e8ecf1;--card:#1e232b;--in:#14171c;--bd:#394150;--sel:#262c36;--hd:#262c36;--grid:#2c333f;--grid2:#232933;--strong:#4a5262;--hl:#33291f;--acc:#ff8a5c;--shadow:none}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--fg);line-height:1.5}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
#mode{width:34px;height:34px;padding:0;border:1px solid var(--bd);background:var(--card);cursor:pointer;position:relative;flex:none}
#mode::after{content:"";position:absolute;inset:8px;border-radius:0;border:2px solid var(--fg);background:linear-gradient(90deg,var(--fg) 50%,transparent 50%)}
.wrap{max-width:900px;margin:0 auto;padding:20px 12px 50px}
h1{font-size:1.4rem;margin:.2em 0}.lead{opacity:.75;margin:0 0 14px;font-size:.9rem}
.card{background:var(--card);border-radius:0;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.ctl>div{flex:1;min-width:110px}label{display:block;font-size:.76rem;opacity:.75;margin-bottom:3px}
select,input{width:100%;font-size:1rem;padding:8px;border-radius:0;border:1px solid var(--bd);background:var(--in);color:var(--fg)}
.sel{margin-top:12px;font-size:.9rem;min-height:2.6em;padding:8px 10px;background:var(--sel);border-radius:0}.sel b{color:var(--acc);font-size:1.15rem}
.tw{overflow:auto;max-height:68vh;border-radius:0;border:1px solid var(--grid)}
table{border-collapse:separate;border-spacing:0;font-size:.88rem;width:100%;min-width:560px;text-align:right}
th,td{padding:7px 8px;border-bottom:1px solid var(--grid);border-right:1px solid var(--grid2);white-space:nowrap}
thead th{position:sticky;top:0;background:var(--hd);z-index:2;font-size:.78rem}
tbody th{position:sticky;left:0;background:var(--hd);z-index:1;text-align:right;font-weight:700}
thead th:first-child{left:0;z-index:3;text-align:right}
td{cursor:pointer;font-variant-numeric:tabular-nums}
td.rl,th.rl{background:var(--hl)}td.cl{background:var(--hl)}td.hit{background:#e8643c;color:#fff;font-weight:700}
tbody tr:nth-child(5n) td,tbody tr:nth-child(5n) th{border-bottom-color:var(--strong)}
.note{font-size:.78rem;opacity:.65;line-height:1.7}
</style></head><body><div class="wrap">
<div class="top"><h1>RM換算表</h1><button id="mode" type="button" aria-label="表示モードを切り替え" title="表示モードを切り替え"></button></div>
<div class="card"><div class="ctl">
<div><label for="s">開始重量（kg）</label><input id="s" type="number" inputmode="decimal" min="0" step="any" value="40" list="sl"><datalist id="sl"><option value="0"><option value="10"><option value="20"><option value="30"><option value="40"><option value="50"><option value="60"><option value="70"><option value="80"><option value="90"><option value="100"></datalist></div>
<div><label for="st">重量の刻み</label><select id="st"><option>1.25</option><option>2.5</option><option selected>5</option><option>10</option></select></div>
<div><label for="n">行数</label><select id="n"><option>15</option><option selected>25</option><option>40</option></select></div>
<div><label for="f">計算式</label><select id="f"><option value="avg" selected>平均（Epley＋Brzycki）</option><option value="ep">Epley</option><option value="br">Brzycki</option></select></div>
</div><div class="sel" id="sel">マスをタップすると推定1RMが出ます。</div></div>
<div class="tw"><table id="t"></table></div>
<div class="card"><p class="note">Epley式は重量×(1+回数÷30)、Brzycki式は重量×36÷(37−回数)で計算しています。回数が10回を超えると誤差が大きくなるので、横軸は12回までです。数値は0.5kg単位に丸めています。この表は種目を区別せず、ベンチプレス・スクワット・デッドリフトで共通の目安です。実際は種目や個人差でずれ、種目ごとに別の計算式を使う換算表もあります。1RMに挑戦するときは、補助者をつけるなど安全に気をつけてください。</p></div>
</div>
<script>
const $=id=>document.getElementById(id),R=12;
function est(w,r,f){const e=r===1?w:w*(1+r/30),b=r===1?w:w*36/(37-r);return f==="ep"?e:f==="br"?b:(e+b)/2}
const fmt=x=>{const v=Math.round(x*2)/2;return Number.isInteger(v)?String(v):v.toFixed(1)};
const fmtW=x=>Number.isInteger(x)?String(x):String(Math.round(x*100)/100);
let selR=-1,selC=-1;
function draw(){const s=Math.max(0,parseFloat($("s").value)||0),st=parseFloat($("st").value),n=parseInt($("n").value,10),f=$("f").value;
let h="<thead><tr><th>重量＼回数</th>";for(let r=1;r<=R;r++)h+=`<th data-c="${r}">${r}回</th>`;h+="</tr></thead><tbody>";
for(let i=0;i<n;i++){const w=s+i*st;h+=`<tr><th data-r="${i}">${fmtW(w)} kg</th>`;for(let r=1;r<=R;r++)h+=`<td data-r="${i}" data-c="${r}" data-w="${w}">${fmt(est(w,r,f))}</td>`;h+="</tr>"}
$("t").innerHTML=h+"</tbody>";selR=selC=-1;$("sel").innerHTML="マスをタップすると推定1RMが出ます。"}
$("t").addEventListener("click",e=>{const td=e.target.closest("td");if(!td)return;
document.querySelectorAll(".rl,.cl,.hit").forEach(x=>x.classList.remove("rl","cl","hit"));
const r=td.dataset.r,c=td.dataset.c;document.querySelectorAll(`[data-r="${r}"]`).forEach(x=>x.classList.add("rl"));document.querySelectorAll(`td[data-c="${c}"]`).forEach(x=>x.classList.add("cl"));td.classList.add("hit");
$("sel").innerHTML=`${fmtW(parseFloat(td.dataset.w))}kg × ${c}回 → 推定1RM <b>${td.textContent} kg</b>`});
const K="rm_settings",ids=["s","st","n","f"];
try{const v=JSON.parse(localStorage.getItem(K)||"{}");ids.forEach(i=>{const el=$(i);if(v[i]==null||v[i]==="")return;const ok=el.tagName==="SELECT"?[...el.options].some(o=>o.value===String(v[i])):true;if(ok)el.value=v[i]})}catch(e){}
function save(){try{const v={};ids.forEach(i=>v[i]=$(i).value);localStorage.setItem(K,JSON.stringify(v))}catch(e){}}
ids.forEach(i=>$(i).addEventListener("input",()=>{draw();save()}));draw();
const root=document.documentElement,mb=$("mode");
function paint(){mb.setAttribute("aria-pressed",root.dataset.theme==="dark")}
mb.addEventListener("click",()=>{root.dataset.theme=root.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("rm_theme",root.dataset.theme)}catch(e){}paint()});paint();
</script></body></html>
